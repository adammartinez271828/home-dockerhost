services:

  # Reverse proxy / network entrypoint. Owns host port 80 and routes by
  # hostname (Host: header) to the service containers over the internal
  # network. Plain HTTP only — see Caddyfile.
  caddy:
    container_name: con_caddy
    image: caddy:2.11.3-alpine
    # image: caddy@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794  # current image
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 32m
    ports:
      - '80:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  db_recipes:
    container_name: con_db_recipes
    image: postgres:16.8-alpine
    # image: postgres@sha256:3b057e1c2c6dfee60a30950096f3fab33be141dbb0fdd7af3d477083de94166c  # current image
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    env_file:
      - ./env.d/recipes.env
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    healthcheck:
      # user/db match POSTGRES_USER/POSTGRES_DB in env.d/recipes.env
      test: ["CMD-SHELL", "pg_isready -U djangouser -d djangodb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web_recipes:
    container_name: con_web_recipes
    image: vabene1111/recipes:1.5.33
    # image: vabene1111/recipes@sha256:e61e3280ed3fb15566230628d82cdbe9bcb68d62cac4500fda431ca8afd045a8  # current image
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    depends_on:
      db_recipes:
        condition: service_healthy
    env_file:
      - ./env.d/recipes.env
    volumes:
      - staticfiles:/opt/recipes/staticfiles
      - nginx_config:/opt/recipes/nginx/conf.d
      - ./mediafiles:/opt/recipes/mediafiles

  # Tandoor's own nginx (static + media). No host port — Caddy fronts it
  # internally as nginx_recipes:80.
  nginx_recipes:
    container_name: con_nginx_recipes
    image: nginx:1.27.4-alpine
    # image: nginx@sha256:4ff102c5d78d254a6f0da062b3cf39eaf07f01eec0927fd21e219d0af8bc0591  # current image
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 16m
    depends_on:
      - web_recipes
    env_file:
      - ./env.d/recipes.env
    volumes:
      - nginx_config:/etc/nginx/conf.d:ro
      - staticfiles:/static:ro
      - ./mediafiles:/media:ro

  # SmokePing — continuous latency + packet-loss grapher; the dockerized
  # successor to the host-side ~/netmon kit. Pings WAN / AT&T gateway / Nest /
  # DNS every few seconds and renders RRD graphs (jitter "smoke" band). No
  # secrets, so its non-secret PUID/PGID/TZ live inline rather than in env.d.
  # Web UI is served at /smokeping/smokeping.cgi — Caddy redirects the bare
  # host there (see Caddyfile). Edit targets in ./smokeping/config/Targets.
  smokeping:
    container_name: con_smokeping
    image: lscr.io/linuxserver/smokeping:2.9.0-r0-ls172
    # on first deploy, record the pulled digest here for rollback:
    # image: lscr.io/linuxserver/smokeping@sha256:...  # current image
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 32m
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./smokeping/config:/config
      - ./smokeping/data:/data

  # Speedtest Tracker — scheduled Ookla speedtests → download/upload/latency
  # history with a web dashboard. APP_KEY is a secret, so config lives in
  # env.d/speedtest.env (gitignored; copy from speedtest.env.example).
  speedtest:
    container_name: con_speedtest
    image: lscr.io/linuxserver/speedtest-tracker:v1.14.3-ls155
    # on first deploy, record the pulled digest here for rollback:
    # image: lscr.io/linuxserver/speedtest-tracker@sha256:...  # current image
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    env_file:
      - ./env.d/speedtest.env
    volumes:
      - ./speedtest/config:/config

volumes:
  nginx_config:
  staticfiles:
  caddy_data:
  caddy_config:

networks:
  default:
    name: network_landockernet
